<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flutter APK Release Automation</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        label {
            font-weight: 600;
            margin-top: 12px;
            display: block;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 2px solid #ddd;
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            background: #fff3cd;
            color: #856404;
        }

        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            white-space: pre-wrap;
        }

        .drive-link {
            display: block;
            margin-top: 10px;
            background: #28a745;
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Flutter APK Automation</h1>

        <div class="card">

            <label>Flutter Project Path *</label>
            <input id="projectPath" placeholder="/path/to/flutter/project" />

            <label>APK Name (optional)</label>
            <input id="apkName" placeholder="app-release.apk" />

            <label>Client Secrets File *</label>
            <input id="clientSecrets" placeholder="client_secret.json" />

            <label>Token File *</label>
            <input id="tokenFile" placeholder="token.json" />

            <button id="buildBtn">🚀 Build & Upload APK</button>

            <div id="status"></div>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        const apiBase = () => document.getElementById("apiBaseUrl").value.trim();
        const statusEl = document.getElementById("status");
        const logEl = document.getElementById("log");
        const btn = document.getElementById("buildBtn");

        btn.addEventListener("click", runPipeline);

        function setStatus(type, message) {
            statusEl.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function log(message) {
            logEl.style.display = "block";
            logEl.textContent += message + "\n\n";
            logEl.scrollTop = logEl.scrollHeight;
        }

        function validateInputs() {
            if (!projectPath.value) throw "Flutter project path is required";
            if (!clientSecrets.value) throw "Client secrets file is required";
            if (!tokenFile.value) throw "Token file is required";
        }

        async function safeFetch(url, payload) {
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const text = await res.text();
            log("RAW RESPONSE:\n" + text);

            try {
                return JSON.parse(text);
            } catch {
                throw "Server returned invalid JSON";
            }
        }

        async function runPipeline() {
            try {
                btn.disabled = true;
                logEl.textContent = "";
                validateInputs();

                setStatus("loading", "🛠 Building Flutter APK...");

                const buildData = await safeFetch(
                    `${apiBase()}/build-apk`,
                    {
                        project_path: projectPath.value,
                        apk_name: apkName.value || "app-release.apk"
                    }
                );

                if (buildData.status !== "success") {
                    throw buildData.error || "APK build failed";
                }

                setStatus("loading", "☁️ Uploading APK to Google Drive...");

                const uploadData = await safeFetch(
                    `${apiBase()}/drive-upload-apk`,
                    {
                        apk_path: buildData.apk_path,
                        apk_name: apkName.value || "app-release.apk",
                        client_secrets_file: clientSecrets.value,
                        token_file: tokenFile.value
                    }
                );

                if (uploadData.status !== "success") {
                    throw uploadData.error || "Upload failed";
                }

                setStatus(
                    "success",
                    `✅ Automation Complete!
         <a class="drive-link" href="${uploadData.data.download_link}" target="_blank">
           📂 Open in Google Drive
         </a>`
                );

            } catch (err) {
                console.error(err);
                setStatus("error", "❌ " + err);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
